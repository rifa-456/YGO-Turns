[project]
name = "ygo-turns"
version = "1.1.0"
description = "Win prediction on turn-level states of expert Yu-Gi-Oh! tournament duels."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "huggingface-hub",
    "joblib",
    "lightning[extra]",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic",
    "rich",
    "scikit-learn",
    "sentence-transformers",
    "triton-windows; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pandas-stubs>=3.0.0.260204",
    "ruff>=0.15.12",
    "scikit-learn-stubs>=0.0.3",
]

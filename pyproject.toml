[project]
name = "ygo-model"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "joblib",
    "lightning[extra]",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic",
    "rich",
    "ruff>=0.15.12",
    "scikit-learn",
    "sentence-transformers",
    "triton-windows",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pandas-stubs>=3.0.0.260204",
    "ruff>=0.15.12",
    "scikit-learn-stubs>=0.0.3",
]
